name: CodeCritique CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # We install requirements, but since torch/cuda take a long time,
        # we can just install CPU versions for CI purposes
        pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
        pip install fastapi uvicorn gradio pydantic wandb pyyaml
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check Python Syntax (Dry Run)
      run: |
        # Simply compile all python files to check for syntax errors
        python -m compileall .
