model_name: "unsloth/Meta-Llama-3.1-8B-bnb-4bit"
output_dir: "models/checkpoints"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 1
  logging_steps: 5
  eval_steps: 20
  save_steps: 20
  max_seq_length: 512
  optim: "paged_adamw_32bit"
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  report_to: "wandb"
  run_name: "llama-3-1-code-review-qlora"
